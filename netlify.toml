[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/auth/session.php"
  to = "/.netlify/functions/session"
  status = 200
  force = true

[[redirects]]
  from = "/api/lista/index.php"
  to = "/.netlify/functions/minha-lista"
  status = 200
  force = true
