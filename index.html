<header><a class="marca" href="./index.html">acompanhe<span>.</span></a><nav aria-label="Catálogo"><button data-tipo="series" aria-pressed="true">Séries</button><button data-tipo="filmes" aria-pressed="false">Filmes</button></nav><section class="autenticacao" aria-label="Sua conta"><div id="google-login"></div><div id="perfil" hidden><div><strong id="usuario-nome"></strong><small id="usuario-email"></small></div><button id="sair" type="button">Sair</button></div><p id="auth-status" role="status" aria-live="polite">Carregando login…</p></section></header>
